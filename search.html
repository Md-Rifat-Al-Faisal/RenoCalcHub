    // 2. Configure Fuse
    const fuse = new Fuse(siteData, {
        keys: ['title', 'tags', 'description'],
        includeScore: true,
        threshold: 0.5,
        distance: 200,
        ignoreLocation: true
    });

    // 3. Execute Search
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q') || "";
    document.getElementById('query-display').innerText = '"' + query + '"';
    
    if(query.length > 1) {
        const results = fuse.search(query);
        const container = document.getElementById('results-container');
        
        if(results.length > 0) {
            results.forEach(result => {
                const item = result.item;
                const icon = item.type === 'Tool' ? 'fa-calculator' : 'fa-book-open';
                const bg = item.type === 'Tool' ? 'bg-blue-100 text-blue-600' : 'bg-orange-100 text-orange-600';

                const div = document.createElement('a');
                div.href = item.url;
                div.className = "block bg-white p-6 rounded-xl border border-slate-200 hover:border-blue-500 hover:shadow-md transition group";
                div.innerHTML = `
                    <div class="flex items-start">
                        <div class="h-12 w-12 ${bg} rounded-lg flex items-center justify-center mr-4 flex-shrink-0 group-hover:scale-110 transition">
                            <i class="fa-solid ${icon} text-lg"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-slate-900 group-hover:text-blue-600 transition">${item.title}</h3>
                            <p class="text-slate-500 mt-1">${item.description}</p>
                            <span class="inline-block mt-3 text-xs font-bold uppercase tracking-wide text-slate-400 bg-slate-100 px-2 py-1 rounded">${item.type}</span>
                        </div>
                    </div>
                `;

            });
