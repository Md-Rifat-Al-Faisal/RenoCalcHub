  <style>
   @media print {
    /* 1. Hide Non-Essential Elements */
    nav, footer, aside, .hero, #related-sidebar, .pinterest-btn, #weather-widget, .ad-slot {
        display: none !important;
    }
    
    /* 2. Hide Buttons (Calculate, Save, Print) so they don't appear on paper */
    button, .btn, input[type="submit"], .fa-solid, .fa-regular, .fa-brands {
        display: none !important;
    }

    /* 3. Reset Layout for Paper */
    body, section, article, .max-w-7xl, .lg\:col-span-9 {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        box-shadow: none !important;
        display: block !important;
    }

    /* 4. Style the Result Box for Print */
    /* We try to target common result container classes */
    #result, .result-box, .bg-emerald-50, .bg-blue-50 {
        border: 2px solid #334155 !important;
        background-color: #fff !important;
        color: #000 !important;
        padding: 20px !important;
        margin-top: 20px !important;
        border-radius: 8px !important;
    }

    /* 5. Add a Pro Footer */
    body::after {
        content: "Report Generated by RenoCalcHub.com";
        display: block;
        text-align: center;
        color: #94a3b8;
        font-size: 10pt;
        margin-top: 50px;
        border-top: 1px solid #e2e8f0;
        padding-top: 10px;
    }
}
  </style>

        <option value="latest">

      </h1>

       Professional guides for precise renovation estimation.

     </div>
     <div class="mt-20 flex flex-col items-center gap-6">
      <div class="flex items-center gap-2">
       <span class="text-xs font-bold text-slate-400">
        Show:
       </span>

        <option value="12">
         12

         24

         36

       </select>

  </div>
  <script src="/load-components.js">
  </script>
  <script src="/authors.js">
  </script>
  <script src="/articles.js">
  </script>
  <script>
   const blogContainer = document.getElementById('blog-container');
        const countDisplay = document.getElementById('article-display-count');
        const sortSelect = document.getElementById('sortSelect');
        const limitSelect = document.getElementById('limitSelect');
        const paginationControls = document.getElementById('pagination-controls');

        // State variables
        let currentFilter = 'all';
        let currentSort = 'latest';
        let itemsPerPage = 12;
        let currentPage = 1;

        // --- 1. RENDER LOGIC ---
        function createCardHTML(article) {
            const authorObj = authors[article.author]; 
            if (!authorObj) return '';

            let catColor = "bg-blue-600";
            if(article.category === 'landscape') catColor = "bg-emerald-600";
            if(article.category === 'exterior') catColor = "bg-orange-600";

            const newBadge = article.isNew ? 
                `<span class="bg-amber-400 text-amber-950 text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full shadow-lg text-center">New</span>` : '';

            const dynamicUrl = `./${article.category}/${article.fileName}`;

            return `
            <a href="${dynamicUrl}" class="blog-card group bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col h-full ring-1 ring-slate-200 ring-offset-0 hover:ring-blue-500/20">
                <div class="h-52 overflow-hidden relative">
                    <img src="${article.image}" alt="${article.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute top-4 left-4 flex gap-2">
                        <span class="${catColor} text-white text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full shadow-lg">${article.category}</span>
                        ${newBadge}
                    </div>
                </div>
                <div class="p-6 flex flex-col flex-grow">
                    <h3 class="text-lg font-black text-slate-900 mb-3 group-hover:text-blue-600 transition-colors leading-tight">${article.title}</h3>
                    <p class="text-slate-500 text-xs mb-6 line-clamp-3">${article.description}</p>
                    <div class="mt-auto flex items-center justify-between border-t border-slate-50 pt-5">
                        <div class="flex items-center space-x-3">
                            <div class="h-8 w-8 rounded-full ${authorObj.bgClass} flex items-center justify-center ring-1 ring-slate-200 shadow-sm">
                                ${authorObj.icon}
                            </div>
                            <span class="text-xs font-bold text-slate-700">${authorObj.name}</span>
                        </div>
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-tighter">${article.date}</span>
                    </div>
                </div>
            </a>
            `;
        }

        // --- SORTING FUNCTION ---
        function getSortedArticles(articles) {
            return articles.sort((a, b) => {
                if (currentSort === 'latest') {
                    return new Date(b.date) - new Date(a.date);
                } else if (currentSort === 'az') {
                    return a.title.localeCompare(b.title);
                } else if (currentSort === 'popular') {
                    return b.description.length - a.description.length;
                }
                return 0;
            });
        }

        // --- PAGINATION RENDERING ---
        function renderPagination(totalPages) {
            paginationControls.innerHTML = '';
            
            if (totalPages <= 1) return;

            // Prev Button
            const prevDisabled = currentPage === 1 ? 'opacity-50 pointer-events-none' : '';
            paginationControls.innerHTML += `
                <button onclick="changePage(${currentPage - 1})" class="h-10 w-10 flex items-center justify-center rounded-xl bg-white border border-slate-200 text-slate-400 shadow-sm hover:bg-slate-50 ${prevDisabled}">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
            `;

            // Page Numbers
            for (let i = 1; i <= totalPages; i++) {
                const activeClass = i === currentPage 
                    ? 'bg-blue-600 text-white font-black shadow-lg' 
                    : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50 font-bold shadow-sm';
                
                paginationControls.innerHTML += `
                    <button onclick="changePage(${i})" class="h-10 w-10 flex items-center justify-center rounded-xl transition ${activeClass}">
                        ${i}
                    </button>
                `;
            }

            // Next Button
            const nextDisabled = currentPage === totalPages ? 'opacity-50 pointer-events-none' : '';
            paginationControls.innerHTML += `
                <button onclick="changePage(${currentPage + 1})" class="h-10 w-10 flex items-center justify-center rounded-xl bg-white border border-slate-200 text-slate-400 shadow-sm hover:bg-slate-50 ${nextDisabled}">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            `;
        }

        // Global function for pagination buttons
        window.changePage = function(newPage) {
            currentPage = newPage;
            renderArticles();
            document.getElementById('blog-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // --- MAIN RENDER FUNCTION ---
        function renderArticles() {
            // 1. Filter
            let filtered = allArticles.filter(article => 
                currentFilter === 'all' || article.category === currentFilter
            );

            // 2. Sort
            let sorted = getSortedArticles(filtered);

            // 3. Pagination Logic
            const totalPages = Math.ceil(sorted.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            let paginated = sorted.slice(startIndex, endIndex);

            // 4. Render Grid
            blogContainer.innerHTML = '';
            
            if(paginated.length > 0) {
                paginated.forEach(article => {
                    blogContainer.innerHTML += createCardHTML(article);
                });
            } else {
                blogContainer.innerHTML = '<p class="text-slate-500 col-span-3 text-center py-12">No articles found in this category.</p>';
            }

            // 5. Render Pagination Controls
            renderPagination(totalPages);

            countDisplay.innerText = `Displaying ${paginated.length} of ${filtered.length} Articles`;
        }

        // Initialize Page
        window.addEventListener('load', () => {
            if(typeof allArticles !== 'undefined') {
                renderArticles();
            } else {
                blogContainer.innerHTML = '<p class="text-center col-span-3 text-slate-400">Loading articles...</p>';
            }
        });

        // --- EVENT LISTENERS ---

        // 1. Categories
        const filterButtons = document.querySelectorAll('.category-btn');
        filterButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                
                // Update UI
                filterButtons.forEach(b => {
                    b.classList.remove('text-blue-600', 'bg-blue-50');
                    b.classList.add('text-slate-600');
                });
                btn.classList.add('text-blue-600', 'bg-blue-50');
                btn.classList.remove('text-slate-600');

                // Update State & Render
                currentFilter = btn.getAttribute('data-filter');
                currentPage = 1; // Reset to page 1 on filter change
                renderArticles();
            });
        });

        // 2. Sorting
        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderArticles();
        });

        // 3. Limit Dropdown
        limitSelect.addEventListener('change', (e) => {
            itemsPerPage = parseInt(e.target.value);
            currentPage = 1; // Reset to page 1 on limit change
            renderArticles();
        });

        // --- SEARCH LOGIC (Using Fuse.js) ---
        window.addEventListener('load', () => {
            if(typeof Fuse !== 'undefined' && typeof allArticles !== 'undefined') {
                const fuse = new Fuse(allArticles, { keys: ['title', 'category', 'description'], threshold: 0.4 });
                const input = document.getElementById('searchInput');
                const container = document.getElementById('searchResults');

                if(input) {
                    input.addEventListener('input', (e) => {
                        const query = e.target.value;
                        if (query.length < 2) { container.classList.add('hidden'); return; }
                        
                        container.innerHTML = '';
                        const results = fuse.search(query);
                        
                        if (results.length === 0) { 
                            container.innerHTML = '<div class="p-4 text-slate-500 text-sm text-center">No matches found.</div>'; 
                        }
                        
                        results.slice(0, 6).forEach(result => {
                            const item = result.item;
                            const searchUrl = `./${item.category}/${item.fileName}`;
                            container.innerHTML += `<a href="${searchUrl}" class="flex items-center p-4 hover:bg-slate-50 transition border-b border-slate-50">
                                <div class="h-8 w-8 bg-blue-50 text-blue-600 rounded flex items-center justify-center mr-3 flex-shrink-0"><i class="fa-solid fa-book-open text-xs"></i></div>
                                <div><div class="text-sm font-bold text-slate-900">${item.title}</div><div class="text-[10px] text-slate-400 uppercase font-black">${item.category}</div></div>
                            </a>`;
                        });
                        container.classList.remove('hidden');
                    });
                }
            }
        });
  </script>
