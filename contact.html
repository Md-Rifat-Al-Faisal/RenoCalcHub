<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Contact Us - RenoCalcHub
  </title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="/favicon.png" rel="icon" type="image/png"/>
  <link href="/css/styles.css" rel="stylesheet"/>
 </head>
 <body class="bg-slate-50 font-sans text-slate-800 flex flex-col min-h-screen">
  <nav class="bg-white border-b border-slate-200 shadow-sm">
   <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
    <a class="flex items-center text-slate-900 font-bold text-xl" href="index.html">
     <i class="fa-solid fa-calculator text-blue-600 mr-2">
     </i>
     RenoCalcHub
    </a>
    <a class="text-sm text-slate-500 hover:text-blue-600" href="index.html">
     Back to Tools
    </a>
   </div>
  </nav>
  <main class="max-w-xl mx-auto px-4 py-16 flex-grow w-full">
   <div class="text-center mb-10">
    <h1 class="text-3xl font-extrabold text-slate-900">
     Contact Us
    </h1>
    <p class="text-slate-500 mt-2">
     Found a bug? Have a calculator request? Let us know.
    </p>
   </div>
   <div class="bg-white p-8 rounded-xl shadow-lg border border-slate-200">
    <form action="/success.html" class="space-y-6" data-netlify="true" method="POST" name="contact">
     <input name="form-name" type="hidden" value="contact"/>
     <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">
       Your Name
      </label>
      <input class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" name="name" required="" type="text"/>
     </div>
     <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">
       Email Address
      </label>
      <input class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" name="email" required="" type="email"/>
     </div>
     <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">
       Message
      </label>
      <textarea class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" name="message" required="" rows="4"></textarea>
     </div>
     <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors" type="submit">
      Send Message
     </button>
    </form>
   </div>
  </main>
  <div id="footer-placeholder">
  </div>
  <script src="/load-components.js">
  </script>
 </body>
</html>
